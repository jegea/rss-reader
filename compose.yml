services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rss-reader-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rss-reader-web
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      - api

  db:
    image: postgres:17
    container_name: rss-reader-db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rss_reader}
      POSTGRES_USER: ${POSTGRES_USER:-rss_reader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TZ: Europe/Madrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  web_node_modules: